<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Immersive Gallery</title>
  <meta name="description" content="A WebXR multimedia art gallery for photos and YouTube videos." />
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="landing">
    <p class="eyebrow">WEBXR COLLECTION</p>
    <h1>Immersive<br />Gallery</h1>
    <p class="intro">Enter a spatial exhibition of photographs and films.</p>
    <button id="enter">Enter gallery <span>↗</span></button>
  </main>

  <button id="close" aria-label="Exit gallery">×</button>

  <div id="content-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <button id="modal-close" aria-label="Close">×</button>
    <div id="modal-content"></div>
  </div>

  <a-scene id="scene" embedded vr-mode-ui="enabled: true" xr-mode-ui="enabled: true">
    <a-sky color="#242329"></a-sky>
    <a-entity light="type: ambient; intensity: 1.25"></a-entity>
    <a-entity light="type: directional; intensity: 1.5" position="0 5 2"></a-entity>

    <a-circle position="0 0 0" rotation="-90 0 0" radius="12"
      material="color: #514d48; roughness: 0.9"></a-circle>
    <a-cylinder id="bin-wall" position="0 3.5 0" radius="12" height="7"
      open-ended="true" segments-radial="64"
      material="color: #625e57; side: double; roughness: 0.9"></a-cylinder>
    <a-cone position="0 7.3 0" radius-bottom="12" radius-top="0.3" height="2.6"
      segments-radial="64" material="color: #514b43; side: double; roughness: 0.9"></a-cone>

    <a-entity id="gallery-ring"></a-entity>
    <a-entity id="player" quest-locomotion>
      <a-camera id="player-camera" position="0 1.6 0">
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .artwork; far: 20"></a-entity>
      </a-camera>
      <a-entity id="left-controller" laser-controls="hand: left"
        cursor="rayOrigin: entity; fuse: false"
        raycaster="objects: .artwork; far: 20" line="color: #d7b6ff; opacity: 0.8"></a-entity>
      <a-entity id="right-controller" laser-controls="hand: right"
        cursor="rayOrigin: entity; fuse: false"
        raycaster="objects: .artwork; far: 20" line="color: #d7b6ff; opacity: 0.8"></a-entity>
    </a-entity>
  </a-scene>

  <script src="app.js"></script>
</body>
</html>
